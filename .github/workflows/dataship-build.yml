name: DataShip BUILD - tests and Windows portable EXE

on:
  push:
    branches:
      - feat/dataship-build-quality-pass
  pull_request:
    paths:
      - 'gui_qt/**'
      - 'services/**'
      - 'test_*.py'
      - 'requirements*.txt'
      - 'build_windows.bat'
      - '.github/workflows/dataship-build.yml'
  workflow_dispatch:

concurrency:
  group: dataship-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Qt headless system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test all Python modules
        run: python -m unittest discover -p 'test_*.py' -v

  windows-exe:
    name: Windows portable EXE / smoke test
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build portable EXE using existing production build script
        shell: cmd
        run: call build_windows.bat
      - name: Verify EXE and archive
        shell: bash
        run: |
          test -f dist/MailPilot/MailPilot.exe
          test -f dist/MailPilot-v12.9-portable.zip
          dist/MailPilot/MailPilot.exe --version
      - name: Upload portable build for manual validation
        uses: actions/upload-artifact@v4
        with:
          name: dataship-windows-portable-build
          path: dist/MailPilot-v12.9-portable.zip
          if-no-files-found: error
          retention-days: 7
