name: Build MailPilot Web (Windows)
on:
  push:
    branches: [feat/web-mail-scheduler]
  workflow_dispatch:
jobs:
  windows-web:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Windows EXEs
        shell: bash
        run: bash scripts/build_web_windows.sh
      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: MailPilot-Web-Windows
          path: dist-web/MailPilot-Web/
          if-no-files-found: error
          retention-days: 7
