name: Build DataShip Web (Windows)
on:
  push:
    branches: [feat/web-mail-scheduler, feat/dataship-design-integration, feat/dataship-vydej-menu, feat/dataship-filtr-vydeje, feat/dataship-ponytail]
    tags: ['dataship-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dataship-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-web:
    runs-on: windows-latest
    timeout-minutes: 45
    # Draft release assets are visible only to repository writers.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified NSSM before compiling
        run: python scripts/package_web_release.py --install-nssm build/nssm-verified
      - name: Full regression suite (known baseline failures are reported)
        id: full_regression
        continue-on-error: true
        run: bash scripts/test_windows.sh
      - name: Required checks for DataShip 1.2.3
        run: |
          .venv-test/Scripts/python.exe -m pytest -q test_web_branding.py test_web_password_separation.py test_vydej_menu.py test_web_pdf_export_tasks.py test_web_daily_profiles.py test_daily_bulk_counts.py test_stravovaci_sestava.py test_web_saved_report_cli.py test_web_daily_flow.py test_web_report_wizard.py test_web_custom_palette.py test_web_release.py

      - name: Build Windows EXEs (isolated web environment)
        run: bash scripts/build_web_windows.sh
      - name: Smoke-test actual frozen GUI and worker
        run: .venv-web/Scripts/python.exe scripts/smoke_windows_build.py --service
      - name: Package clean portable and NSSM distributions
        run: .venv-web/Scripts/python.exe scripts/package_web_release.py --commit "$GITHUB_SHA"
      - name: Upload verified Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: DataShip-Windows-${{ github.sha }}
          path: release-dist/**/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish DataShip 1.2.3 test release
        if: github.ref == 'refs/heads/feat/dataship-ponytail'
        run: |
          set -Eeuo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" == "1.2.3-rc.1" ]] || exit 0
          tag="dataship-v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo 'Tag and VERSION disagree; refusing to prepare the release.' >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite it."
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' > "$RUNNER_TEMP/tag-sha" 2>/dev/null; then
            [[ "$(cat "$RUNNER_TEMP/tag-sha")" == "$GITHUB_SHA" ]] || {
              echo 'Tag exists at a different commit; refusing to prepare the release.' >&2
              exit 1
            }
          fi
          gh release create "$tag" release-dist/"$version"/* \
            --target "$GITHUB_SHA" --title "DataShip $version" \
            --notes-file "docs/releases/$version.md" \
            --prerelease --latest=false
